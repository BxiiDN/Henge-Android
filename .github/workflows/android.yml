name: Android port

on:
  push:
    branches: [main, android-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 test toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user cmake
      - name: Build the real CPU engine and tests
        run: |
          cmake -S . -B build/linux-arm64 -DCMAKE_TOOLCHAIN_FILE=cmake/linux-arm64.cmake -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/linux-arm64 -j4
      - name: Run ARM64 regression tests on the Linux host
        env:
          QEMU_CPU: max
          QEMU_STACK_SIZE: 67108864
        run: ctest --test-dir build/linux-arm64 --output-on-failure
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build and lint diagnostic APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Henge-Android-diagnostics-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.*
