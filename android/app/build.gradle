plugins { id 'com.android.application' }
android {
    namespace 'io.github.bxiidn.henge'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.3.13750724'
    // Henge emits ARM64 machine code. x86 ChromeOS is not a supported host.
    lint { disable 'ChromeOsAbiSupport' }
    defaultConfig {
        applicationId 'io.github.bxiidn.henge.serial'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0-dev'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DHENGE_BUILD_TESTS=OFF', '-DHENGE_ANDROID_APP=ON', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
